name: CI

on:
  push:
  pull_request:

jobs:
  build-test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtest-dev gcovr

      - name: Configure
        run: cmake -S . -B build -G Ninja -DLMS_COVERAGE=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Coverage (domain layer, minimum 70%)
        run: gcovr --root . --filter 'src/domain/' --print-summary --fail-under-line 70 --xml coverage.xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
